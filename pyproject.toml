[project]
name = "checkbox-detector"
version = "0.1.0"
description = "Detect checkboxes in images and paint them."
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=10.0",
    "pydantic>=2.0",
    "python-multipart>=0.0.18",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
]
